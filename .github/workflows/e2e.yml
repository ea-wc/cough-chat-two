name: E2E tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter e2e exec playwright install --with-deps chromium

      - name: Start the stack (isolated e2e database)
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml up -d --build

      - name: Wait for the app to be ready
        run: |
          for i in $(seq 1 90); do
            if curl -sf http://localhost:4000/api/health >/dev/null \
               && curl -sf http://localhost:3000/ >/dev/null; then
              echo "stack ready after ${i} checks"
              exit 0
            fi
            sleep 2
          done
          echo "stack did not become ready"
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml logs
          exit 1

      - name: Run end-to-end tests
        run: pnpm e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/e2e/playwright-report/
          retention-days: 7

      - name: Tear down the stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml down -v
