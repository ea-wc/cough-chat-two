# Override for the end-to-end test stack: an isolated throwaway database so the
# regression suite never touches the developer's local data. Run with:
#   docker compose -f docker-compose.yml -f docker-compose.e2e.yml up --build
services:
  postgres:
    environment:
      POSTGRES_DB: telehealth_e2e
    volumes:
      - e2e_pgdata:/var/lib/postgresql/data

  api:
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/telehealth_e2e?schema=public

volumes:
  e2e_pgdata:
